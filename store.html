<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDX CHEF STORE | متجر شحن الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold:#D4AF37; --gold-hover:#F3E5AB; --bg:#0a0a0a; --card:#141414; --text:#F5F5F5; --muted:#A0A0A0; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
  body { background:var(--bg); color:var(--text); line-height: 1.6; font-size: 14px; }
  
  header { background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212,175,55,0.2); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .logo-area { display: flex; align-items: center; gap: 5px; color: var(--gold); font-weight: 900; font-size: 1.1rem; }
  nav { display: flex; gap: 12px; align-items: center; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
  nav::-webkit-scrollbar { display: none; }
  nav a { color: var(--text); text-decoration: none; font-size: 0.85rem; font-weight: 700; cursor: pointer; padding: 5px 0; }
  nav a.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
  .user-icon { width: 35px; height: 35px; border-radius: 50%; background: #222; border: 2px solid var(--gold); display: grid; place-items: center; cursor: pointer; }
  .user-icon svg { width: 18px; height: 18px; fill: var(--gold); }
  .user-icon.logged-in { border-color: #25D366; }
  .user-icon.logged-in svg { fill: #25D366; }

  .container { max-width: 1000px; margin: 0 auto; padding: 0 15px 40px 15px; }
  .page-section { display: none; }
  .page-section.active { display: block; }
  .hero { position: relative; background: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1600&q=80') center/cover no-repeat; border-radius: 15px; padding: 60px 20px; text-align: center; margin-top: 20px; margin-bottom: 30px; overflow: hidden; border: 1px solid rgba(212,175,55,0.3); }
  .hero::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(10,10,10,0.7), rgba(10,10,10,0.95)); z-index: 1; }
  .hero-content { position: relative; z-index: 2; }
  .hero h1 { color: var(--gold); font-size: 1.8rem; margin-bottom: 10px; font-weight: 900; }
  .hero p { font-size: 1rem; color: #ddd; margin-bottom: 20px; }
  .hero-btn { background: var(--gold); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: 900; text-decoration: none; display: inline-block; border: none; cursor: pointer; }
  
  .section-title { text-align: center; color: var(--text); margin-bottom: 20px; font-size: 1.3rem; font-weight: 900; padding-bottom: 8px; border-bottom: 2px solid var(--gold); display: inline-block; position: relative; right: 50%; transform: translateX(50%); }
  .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
  .product-card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .product-img { width: 100%; height: 120px; object-fit: cover; }
  .product-info { padding: 12px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
  .product-info h3 { color: var(--gold); font-size: 0.95rem; margin-bottom: 5px; }
  .product-info p { color: var(--muted); font-size: 0.75rem; margin-bottom: 10px; flex-grow: 1; }
  .price { font-size: 1.1rem; color: var(--text); font-weight: 900; margin-bottom: 10px; }
  .btn { background: var(--gold); color: #000; border: none; cursor: pointer; padding: 8px; border-radius: 8px; font-weight: 700; width: 100%; font-family: inherit; font-size: 0.85rem; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; place-items: center; }
  .modal-content { background: var(--card); border: 1px solid var(--gold); border-radius: 15px; padding: 25px 20px; width: 90%; max-width: 380px; text-align: center; position: relative; }
  .close-btn { position: absolute; top: 10px; left: 15px; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
  .pay-btn { width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; color: #fff; }
  .pay-flexy { background: #ff6b00; } .pay-ccp { background: #0055a4; } .pay-binance { background: #f3ba2f; color: #000; }
  
  .input-group { margin-bottom: 15px; text-align: right; }
  .input-group label { display: block; margin-bottom: 5px; color: var(--gold); font-weight: 700; }
  .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-family: inherit; }
  .error-msg { background: rgba(255,0,0,0.1); color: #ff4d4d; padding: 8px; border-radius: 6px; margin-bottom: 15px; display: none; }
  footer { text-align: center; padding: 20px; border-top: 1px solid #222; color: var(--muted); margin-top: 40px; }
</style>
</head>
<body onload="initApp()">

<header>
  <div class="logo-area">GDX CHEF</div>
  <nav>
    <a onclick="showPage('home')" class="active" id="nav-home">الرئيسية</a>
    <a onclick="showPage('games')" id="nav-games">شحن الألعاب</a>
    <a onclick="showPage('accounts')" id="nav-accounts">حسابات</a>
  </nav>
  <div class="user-icon" id="userIconBtn" onclick="handleUserIconClick()">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </div>
</header>

<div class="container">
  <div id="page-home" class="page-section active">
    <div class="hero"><div class="hero-content"><h1>مرحباً بك في GDX CHEF</h1><p>أفضل متجر لشحن الألعاب وبيع الحسابات</p><button class="hero-btn" onclick="showPage('games')">تصفح المنتجات</button></div></div>
    <h2 class="section-title">أحدث المنتجات</h2>
    <div class="products-grid" id="home-products"></div>
  </div>
  <div id="page-games" class="page-section"><h2 class="section-title">شحن الألعاب والتطبيقات</h2><div class="products-grid" id="games-products"></div></div>
  <div id="page-accounts" class="page-section"><h2 class="section-title">حسابات الألعاب</h2><div class="products-grid" id="accounts-products"></div></div>
</div>

<div class="modal-overlay" id="paymentModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('paymentModal')">&times;</button>
    <h2 style="color:var(--gold); margin-bottom: 10px;">اختر طريقة الدفع</h2>
    <p id="modal-product-name" style="margin-bottom: 20px; font-weight: 700;"></p>
    <div id="payment-options"></div>
  </div>
</div>

<div class="modal-overlay" id="receiptModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('receiptModal')">&times;</button>
    <h2 style="color:var(--gold); margin-bottom: 15px;">إتمام الطلب</h2>
    <div class="input-group"><label>المبلغ المدفوع</label><input type="text" id="receiptAmount" placeholder="مثلاً 1000"></div>
    <div class="input-group"><label>صورة الوصل</label><input type="file" id="receiptFile" accept="image/*" style="padding: 8px;"></div>
    <button class="btn" id="submitReceiptBtn" onclick="submitReceipt()">تأكيد الطلب</button>
  </div>
</div>

<div class="modal-overlay" id="authModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
    <h2 id="authTitle" style="color:var(--gold); margin-bottom: 20px;">تسجيل الدخول</h2>
    <div id="authError" class="error-msg"></div>
    <div class="input-group"><label>البريد الإلكتروني</label><input type="email" id="authEmail"></div>
    <div class="input-group"><label>كلمة المرور</label><input type="password" id="authPassword"></div>
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">دخول</button>
    <div style="margin-top: 15px; font-size: 0.9rem;"><span id="authSwitchText">ليس لديك حساب؟ </span><a onclick="toggleAuthMode()" id="authSwitchLink" style="color:var(--gold); cursor:pointer; text-decoration:underline;">أنشئ حساباً</a></div>
  </div>
</div>

<div class="modal-overlay" id="profileModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
    <h2 style="color:var(--gold); margin-bottom: 15px;">حسابي</h2>
    <p id="profileEmail" style="margin-bottom: 20px;"></p>
    <button class="btn" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d;" onclick="handleLogout()">تسجيل الخروج</button>
  </div>
</div>

<footer>&copy; 2024 GDX CHEF STORE.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://focoxfmdmcjofswmgkco.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY294Zm1kbWNqb2Zzd21na2NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MjMzMTYsImV4cCI6MjEwOTQ5OTMxNn0.H2At_v8QhrO89001o-y0nV0sXf3Ve6nSgUcqI3RtEq8';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null; let isSignUpMode = false;
  let currentOrderProduct = ""; let currentOrderMethod = "";

  function initApp() { checkSession(); loadProducts(); }

  async function checkSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session) { currentUser = session.user; updateUI(); }
  }
  function updateUI() { document.getElementById('userIconBtn').classList.toggle('logged-in', !!currentUser); }

  function handleUserIconClick() {
    if (currentUser) {
      document.getElementById('profileEmail').innerText = currentUser.email;
      document.getElementById('profileModal').style.display = 'grid';
    } else { document.getElementById('authModal').style.display = 'grid'; }
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').innerText = isSignUpMode ? 'إنشاء حساب' : 'تسجيل الدخول';
    document.getElementById('authSubmitBtn').innerText = isSignUpMode ? 'إنشاء' : 'دخول';
    document.getElementById('authSwitchText').innerText = isSignUpMode ? 'لديك حساب؟ ' : 'ليس لديك حساب؟ ';
    document.getElementById('authSwitchLink').innerText = isSignUpMode ? 'سجل الدخول' : 'أنشئ حساباً';
  }

  async function handleAuthSubmit() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const errorDiv = document.getElementById('authError');
    const submitBtn = document.getElementById('authSubmitBtn');
    if (!email || !password) { errorDiv.innerText = 'املأ الحقول'; errorDiv.style.display = 'block'; return; }
    submitBtn.innerText = '...'; submitBtn.disabled = true;
    try {
      if (isSignUpMode) {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        alert('تم إنشاء الحساب! سجل الدخول الآن.'); toggleAuthMode();
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user; closeModal('authModal'); updateUI();
      }
    } catch (error) { errorDiv.innerText = error.message; errorDiv.style.display = 'block'; } 
    finally { submitBtn.innerText = isSignUpMode ? 'إنشاء' : 'دخول'; submitBtn.disabled = false; }
  }

  async function handleLogout() { await supabaseClient.auth.signOut(); currentUser = null; closeModal('profileModal'); updateUI(); }

  function showPage(pageId) {
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('nav a').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    document.getElementById('nav-' + pageId).classList.add('active');
  }

  async function loadProducts() {
    const { data: products, error } = await supabaseClient.from('products').select('*');
    if (error) return;
    const homeGrid = document.getElementById('home-products');
    const gamesGrid = document.getElementById('games-products');
    const accountsGrid = document.getElementById('accounts-products');
    homeGrid.innerHTML = ''; gamesGrid.innerHTML = ''; accountsGrid.innerHTML = '';
    products.forEach((product, index) => {
      const card = createProductCard(product);
      if (product.category === 'games' || product.category === 'apps') gamesGrid.appendChild(createProductCard(product));
      else if (product.category === 'accounts_ff' || product.category === 'accounts_efootball') accountsGrid.appendChild(createProductCard(product));
      if(index < 4) homeGrid.appendChild(createProductCard(product));
    });
  }

  function createProductCard(product) {
    const div = document.createElement('div');
    div.className = 'product-card';
    div.innerHTML = `<img src="${product.image_url || 'https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=500&q=80'}" class="product-img"><div class="product-info"><h3>${product.name}</h3><p>${product.description}</p><div class="price">${product.price} DA</div><button class="btn" onclick="handleBuy('${product.name}', '${product.category}')">شراء</button></div>`;
    return div;
  }

  function handleBuy(productName, type) {
    if (!currentUser) { alert('سجل الدخول أولاً!'); document.getElementById('authModal').style.display = 'grid'; return; }
    currentOrderProduct = productName;
    document.getElementById('modal-product-name').innerText = productName;
    const optionsContainer = document.getElementById('payment-options');
    optionsContainer.innerHTML = type === 'accounts_ff' || type === 'accounts_efootball' 
      ? `<button class="pay-btn pay-ccp" onclick="selectPayment('CCP / BaridiMob')">CCP / BaridiMob</button><button class="pay-btn pay-binance" onclick="selectPayment('Binance')">Binance</button>`
      : `<button class="pay-btn pay-flexy" onclick="selectPayment('Flexy')">Flexy</button><button class="pay-btn pay-ccp" onclick="selectPayment('CCP')">CCP / BaridiMob</button><button class="pay-btn pay-binance" onclick="selectPayment('Binance')">Binance</button>`;
    document.getElementById('paymentModal').style.display = 'grid';
  }

  function selectPayment(method) {
    currentOrderMethod = method; closeModal('paymentModal'); document.getElementById('receiptModal').style.display = 'grid';
  }

  async function submitReceipt() {
    const amount = document.getElementById('receiptAmount').value;
    const file = document.getElementById('receiptFile').files[0];
    const submitBtn = document.getElementById('submitReceiptBtn');
    if (!amount || !file) { alert('أدخل المبلغ وارفع الصورة'); return; }
    submitBtn.innerText = 'جاري...'; submitBtn.disabled = true;
    try {
      const fileName = `${Date.now()}_${currentUser.email.split('@')[0]}.${file.name.split('.').pop()}`;
      let { error: uploadError } = await supabaseClient.storage.from('receipts').upload(fileName, file);
      if (uploadError) throw uploadError;
      const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(fileName);
      const { error: dbError } = await supabaseClient.from('orders').insert({ user_email: currentUser.email, product_name: currentOrderProduct, payment_method: currentOrderMethod, amount_paid: amount, receipt_url: urlData.publicUrl });
      if (dbError) throw dbError;
      alert('تم إرسال الطلب!'); closeModal('receiptModal'); document.getElementById('receiptAmount').value = ''; document.getElementById('receiptFile').value = '';
    } catch (error) { alert('خطأ: ' + error.message); } 
    finally { submitBtn.innerText = 'تأكيد الطلب'; submitBtn.disabled = false; }
  }
</script>
</body>
</html>
