<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم GDX CHEF</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#D4AF37;--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--text:#F5F5F5;--muted:#A0A0A0;--yellow:#f39c12;--green:#25D366;--red:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
input,select,textarea{width:100%;padding:11px;margin-bottom:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
.btn{background:linear-gradient(45deg,#D4AF37,#F3E5AB);color:#000;border:0;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
.sm{width:auto;padding:6px 12px;font-size:.85rem;border-radius:6px;border:0;font-weight:700;cursor:pointer;color:#fff}
.ok{background:var(--green)}.no{background:var(--red)}.gr{background:#444}.gd{background:var(--gold);color:#000}
#login{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:14px}
.lbox{background:var(--card);border:1px solid var(--gold);padding:28px;border-radius:12px;width:100%;max-width:400px;text-align:center}
#app{display:none;padding:16px;max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #333;padding-bottom:12px}
.top h1{color:var(--gold);font-size:1.4rem}
.tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}
.tab{background:#222;color:var(--text);border:1px solid #333;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap}
.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}
.sec{display:none}.sec.active{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;margin-bottom:3px;font-size:.88rem}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:92%;max-width:380px}
.toast{background:#1d1d1d;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:700;font-size:.9rem}
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <h2 style="color:var(--gold);margin-bottom:16px;">لوحة تحكم GDX CHEF</h2>
  <input type="email" id="aemail" placeholder="البريد الإلكتروني">
  <input type="password" id="apass" placeholder="كلمة المرور">
  <button class="btn" onclick="login()">دخول</button>
</div></div>

<div id="app">
  <div class="top"><h1>لوحة التحكم</h1><button class="sm no" onclick="db.auth.signOut()">خروج</button></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('orders', this)">الطلبات</button>
    <button class="tab" onclick="switchTab('wallet', this)">طلبات شحن المحفظة 💳</button>
    <button class="tab" onclick="switchTab('products', this)">المنتجات</button>
  </div>

  <div id="tab-orders" class="sec active">
    <div id="ordersList"></div>
  </div>

  <!-- تبويب طلبات شحن المحفظة الجديد -->
  <div id="tab-wallet" class="sec">
    <div id="walletList"></div>
  </div>

  <div id="tab-products" class="sec">
    <div class="box">
      <h3 style="color:var(--gold); margin-bottom:12px;">إضافة / تعديل منتج</h3>
      <label>اسم المنتج</label><input id="pName">
      <label>التصنيف</label>
      <select id="pCat">
        <option value="games">شحن ألعاب</option>
        <option value="accounts_ff">حساب Free Fire</option>
        <option value="accounts_efootball">حساب eFOOTBALL</option>
      </select>
      <label>الوصف (يدعم الأسطر المتعددة)</label><textarea id="pDesc" rows="3"></textarea>
      
      <!-- الأسعار المزدوجة -->
      <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>السعر (DA)</label><input type="number" id="pPriceDa"></div>
        <div style="flex:1;"><label>السعر ($ USD)</label><input type="number" id="pPriceUsd" placeholder="اختياري"></div>
      </div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>التخفيض (DA)</label><input type="number" id="pDiscDa"></div>
        <div style="flex:1;"><label>التخفيض ($ USD)</label><input type="number" id="pDiscUsd" placeholder="اختياري"></div>
      </div>

      <label>رابط الصورة الرئيسية (https)</label><input id="pImg">
      <button class="btn" onclick="saveProduct()" style="margin-top:10px;">حفظ المنتج</button>
    </div>
    <div id="productsList"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://focoxfmdmcjofswmgkco.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY294Zm1kbWNqb2Zzd21na2NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MjMzMTYsImV4cCI6MjEwOTQ5OTMxNn0.H2At_v8QhrO89001o-y0nV0sXf3Ve6nSgUcqI3RtEq8';
const ADMIN_EMAIL='chefgdx@gmail.com';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US');

function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('toasts').appendChild(e);setTimeout(()=>e.remove(),3500)}

async function login(){
  const { error } = await db.auth.signInWithPassword({ email: $('aemail').value, password: $('apass').value });
  if(error) toast(error.message, 'bad');
}

async function switchTab(tabId, btn){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  $('tab-'+tabId).classList.add('active');
  
  if(tabId === 'orders') loadOrders();
  if(tabId === 'wallet') loadWalletRequests();
  if(tabId === 'products') loadProducts();
}

/* --- الطلبات العادية --- */
async function loadOrders(){
  const { data } = await db.from('orders').select('*').order('created_at', {ascending:false});
  const box = $('ordersList');
  if(!data || !data.length) { box.innerHTML = '<div class="item">لا توجد طلبات.</div>'; return; }
  
  box.innerHTML = data.map(o => `<div class="item">
    <div>
      <h4>${esc(o.product_name)} <span style="color:var(--yellow); font-size:0.8rem;">(${o.status})</span></h4>
      <p style="font-size:0.85rem; color:var(--muted);">الزبون: ${esc(o.user_email)}</p>
      <p style="font-size:0.85rem; color:var(--muted);">الدفع: ${esc(o.payment_method)}</p>
      ${o.amount_paid ? `<p style="font-size:0.85rem; color:var(--gold);">${o.amount_paid} DA</p>` : ''}
      ${o.amount_paid_usd ? `<p style="font-size:0.85rem; color:var(--green);">$${o.amount_paid_usd} USD</p>` : ''}
    </div>
    <div style="display:flex; gap:5px;">
      ${o.status === 'pending' ? `
        <button class="sm ok" onclick="updateOrder('${o.id}', 'approved')">قبول</button>
        <button class="sm no" onclick="updateOrder('${o.id}', 'rejected')">رفض</button>
      ` : ''}
    </div>
  </div>`).join('');
}

async function updateOrder(id, status){
  await db.from('orders').update({status}).eq('id', id);
  toast('تم تحديث الطلب', 'ok'); loadOrders();
}

/* --- طلبات شحن المحفظة (الجديد) --- */
async function loadWalletRequests(){
  const { data } = await db.from('wallet_requests').select('*').order('created_at', {ascending:false});
  const box = $('walletList');
  if(!data || !data.length) { box.innerHTML = '<div class="item">لا توجد طلبات شحن.</div>'; return; }
  
  box.innerHTML = data.map(r => `<div class="item" style="border-color:${r.status==='pending'?'var(--yellow)':'var(--line)'};">
    <div>
      <h4>شحن: ${r.amount} ${r.currency} <span style="font-size:0.8rem; color:var(--muted);">(${r.method})</span></h4>
      <p style="font-size:0.85rem; color:var(--muted);">الزبون: ${esc(r.user_email)}</p>
      <a href="${esc(r.receipt_url)}" target="_blank" style="color:var(--blue); font-size:0.85rem;">عرض الوصل</a>
    </div>
    <div>
      ${r.status === 'pending' ? `
        <button class="sm ok" onclick="approveWallet('${r.id}', '${r.user_email}', ${r.amount}, '${r.currency}')">موافقة وشحن</button>
        <button class="sm no" onclick="rejectWallet('${r.id}')">رفض</button>
      ` : `<span style="color:var(--muted); font-size:0.8rem;">تمت المعالجة</span>`}
    </div>
  </div>`).join('');
}

async function approveWallet(id, email, amount, currency){
  if(!confirm('هل أنت متأكد من إضافة هذا المبلغ لمحفظة الزبون؟')) return;
  
  // 1. جلب الرصيد الحالي
  let { data: wallet } = await db.from('wallets').select('*').eq('user_email', email).single();
  if(!wallet) await db.from('wallets').insert({user_email: email, balance_da: 0, balance_usd: 0});
  
  const newDa = Number(wallet?.balance_da || 0) + (currency === 'DA' ? Number(amount) : 0);
  const newUsd = Number(wallet?.balance_usd || 0) + (currency === 'USD' ? Number(amount) : 0);
  
  // 2. تحديث المحفظة
  await db.from('wallets').update({ balance_da: newDa, balance_usd: newUsd }).eq('user_email', email);
  
  // 3. تغيير حالة الطلب
  await db.from('wallet_requests').update({ status: 'approved' }).eq('id', id);
  
  toast('تم شحن المحفظة بنجاح', 'ok');
  loadWalletRequests();
}

async function rejectWallet(id){
  await db.from('wallet_requests').update({ status: 'rejected' }).eq('id', id);
  toast('تم رفض الطلب', 'bad'); loadWalletRequests();
}

/* --- المنتجات --- */
async function loadProducts(){
  const { data } = await db.from('products').select('*').order('created_at', {ascending:false});
  const box = $('productsList');
  box.innerHTML = (data||[]).map(p => `<div class="item">
    <div>
      <h4 style="color:var(--gold);">${esc(p.name)}</h4>
      <p style="font-size:0.8rem; color:var(--muted);">${money(p.price)} DA ${p.price_usd ? `| $${p.price_usd}` : ''}</p>
    </div>
    <button class="sm no" onclick="deleteProduct('${p.id}')">حذف</button>
  </div>`).join('');
}

async function saveProduct(){
  const row = {
    name: $('pName').value,
    category: $('pCat').value,
    description: $('pDesc').value,
    price: Number($('pPriceDa').value) || 0,
    price_usd: Number($('pPriceUsd').value) || 0,
    discount_price: Number($('pDiscDa').value) || null,
    discount_price_usd: Number($('pDiscUsd').value) || null,
    image_url: $('pImg').value
  };
  const { error } = await db.from('products').insert(row);
  if(error) toast(error.message, 'bad');
  else { toast('تمت إضافة المنتج', 'ok'); loadProducts(); }
}

async function deleteProduct(id){
  if(!confirm('حذف المنتج؟')) return;
  await db.from('products').delete().eq('id', id);
  loadProducts();
}

db.auth.onAuthStateChange((_e, session) => {
  if(session && session.user.email === ADMIN_EMAIL) {
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    loadOrders();
  } else {
    $('login').style.display = 'flex';
    $('app').style.display = 'none';
  }
});
</script>
</body>
</html>
