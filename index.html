<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDX CHEF STORE</title>
<style>
  :root { --gold:#C9A24B; --gold-soft:#E8D39A; --text:#EFE6D0; --muted:#9A9078; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background:#000; color:var(--text); font-family: Tahoma, system-ui, sans-serif;
         display:grid; place-items:center; text-align:center; padding:24px; }
  main { max-width:520px; }
  .mark { width:84px; height:84px; margin:0 auto 28px; border:2px solid var(--gold);
          border-radius:50%; display:grid; place-items:center; font-weight:900;
          font-size:1.5rem; color:var(--gold); direction:ltr; }
  h1 { font-size:clamp(2rem,8vw,3rem); font-weight:900; color:var(--gold);
       direction:ltr; letter-spacing:.06em; }
  p { margin-top:14px; font-size:1.1rem; color:var(--gold-soft); }
  .ok { margin-top:32px; padding-top:20px; border-top:1px solid #2a2418;
        font-size:.95rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">GDX</div>
  <h1>GDX CHEF STORE</h1>
  <p>شحن الألعاب وحسابات الألعاب</p>
  <div class="ok">صفحة اختبار النشر — المتجر قيد التجهيز</div>
</main>
</body>
</html>
